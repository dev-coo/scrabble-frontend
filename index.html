<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대기실 — 스크래블</title>
  <!-- 화면 겉모습(CSS)은 styles.css 로 분리했습니다. 디자인만 고칠 땐 그 파일만 열면 됩니다. -->
  <link rel="stylesheet" href="styles.css" />
  <!-- 채팅은 대기실·게임 화면이 함께 쓰는 모듈입니다. 두 화면이 같은 파일을 불러 씁니다. -->
  <link rel="stylesheet" href="chat/chat.css" />
  <!-- 게임판. 게임 화면에서만 쓰지만, 파일 하나라 미리 불러둡니다. -->
  <link rel="stylesheet" href="game/board.css" />
</head>
<body>

<!--
  대기실 페이지 — design/pages/lobby.html 에서 그린 화면을 실제 앱으로 옮긴 것입니다.
    ① 닉네임 (로그인 / 새로 만들기)  ← 진짜 백엔드를 부릅니다
    ─ 모드 선택                      ← 화면 안에서만 고르는 것이라 서버가 필요 없습니다
    ② 방코드 입력 + 입장             ← 웹소켓으로 진짜 들어갑니다
    ③ 방 생성 + 코드 공유            ← 웹소켓으로 진짜 만듭니다
    ④ 랜덤 매칭                      ← 웹소켓으로 진짜 짝지어 줍니다
    ─ 채팅                           ← 웹소켓으로 진짜 주고받습니다

  가짜 값(목 데이터)은 넣지 않습니다. 없는 값을 지어내 보여주면 되는 것처럼
  보이다가, 진짜 API 가 붙는 순간 조용히 어긋납니다. 그래서 아직 못 하는 일은
  버튼을 잠그고 왜 잠갔는지 화면에 밝힙니다.
-->

<div class="board">

  <div class="lobby" id="lobbyView">

    <!-- 단계와 상관없이 알릴 일이 있을 때만 채워집니다. -->
    <div id="noteBox"></div>

    <div class="crown">
      <div class="tiles" aria-hidden="true">
        <div class="tile">S</div><div class="tile">C</div><div class="tile">R</div><div class="tile">A</div>
        <div class="tile">B</div><div class="tile">B</div><div class="tile">L</div><div class="tile">E</div>
      </div>
      <h1>대기실</h1>
    </div>

    <div class="stepper" id="stepper">
      <div class="pip is-now"><i class="pip-no">1</i>닉네임</div>
      <div class="pip"><i class="pip-no">2</i>모드</div>
      <div class="pip"><i class="pip-no">3</i>시작</div>
    </div>

    <!-- ① 닉네임 -->
    <section class="step" id="step1">
      <p class="step-head"><i class="step-no">1</i>닉네임</p>
      <div id="step1Body"></div>
    </section>

    <!-- ② 모드 + 그에 따라 열리는 것 -->
    <section class="step is-locked" id="step2">
      <p class="step-head"><i class="step-no">2</i>누구와 할까요</p>
      <div id="step2Body"></div>
    </section>

    <!-- ③ 시작 -->
    <section class="step is-locked" id="step3">
      <p class="step-head"><i class="step-no">3</i>시작</p>
      <div id="step3Body"></div>
    </section>

  </div>

  <!--
    게임 화면 (/game).

    별도의 파일로 만들지 않았습니다. 페이지를 새로 불러오면 웹소켓이
    끊기고, 끊기면 방도 같이 사라지기 때문입니다(명세). 그래서 주소만
    /game 으로 바꾸고 연결은 그대로 둔 채 이 칸으로 갈아끼웁니다.
    주소창에는 똑같이 /game 이 찍히고 뒤로가기도 됩니다.
  -->
  <div class="stage" id="gameView" hidden></div>

  <!-- 채팅이 붙는 자리. 안에 들어갈 것은 chat/chat.js 가 만듭니다.
       떠 있는 모드라 이 자리가 어디든 화면 오른쪽 아래에 나타납니다.
       대기실과 게임 화면 밖에 있어서 넘어가도 대화가 그대로 남습니다. -->
  <div id="chatBox"></div>

</div>

<!-- 채팅·게임판 모듈 — 아래 대기실 코드보다 먼저 읽혀야 합니다. -->
<script src="chat/chat.js"></script>
<script src="game/board.js"></script>

<script>
  (function () {

    // 프론트엔드는 백엔드에 API로 "요청"해서 값을 받아옵니다.
    // 백엔드 주소가 바뀌면 이 한 줄만 고치면 됩니다.
    var API_BASE = "http://100.115.173.118:11000";

    // 웹소켓은 http 대신 ws 로 시작합니다. 주소는 같은 곳이라 바꿔 씁니다.
    // (https 였다면 wss 가 됩니다)
    var WS_BASE = API_BASE.replace(/^http/, 'ws');

    // 닉네임 길이. 입력칸·글자수 표시·검사 문구가 전부 이 값 하나를
    // 보고 움직이므로, 길이를 바꿀 때는 여기만 고치면 됩니다.
    //
    // ⚠️ 백엔드는 20자까지 받아줍니다(명세: 공백 제거 후 1~20자).
    //    지금은 화면에서만 10자로 좁혀둔 것이라, 스와거처럼 다른 길로
    //    등록한 11자 이상 닉네임은 이 화면에서 로그인할 수 없습니다.
    //    규칙이 화면에만 있으면 화면을 안 거친 값은 못 막습니다.
    //    백엔드에도 10자를 넣어달라고 요청해 두었습니다
    //    (docs/backend-requests.md).
    var NICK_MAX = 10;
    // 코드 입력칸 수. 명세대로 방 코드는 대문자·숫자 4자리입니다.
    // 헷갈리기 쉬운 O·I·L·0·1 은 코드에 나오지 않습니다.
    // (여기 있던 "백엔드는 6자리라 입장이 막혀 있다"는 경고는 사실이
    //  아니어서 지웠습니다. 백엔드가 4자리로 바뀔 때 코드는 고쳤는데
    //  주석만 남아, 그 뒤로 읽는 사람마다 막힌 줄 알았습니다.)
    var CODE_LEN = 4;
    var LETTERS  = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';


    // ── 지금 어디까지 왔는지 ────────────────────────────
    var s = {
      nick: null,      // 확인까지 끝난 닉네임
      playerId: null,  // 백엔드가 돌려준 내 id
      mode: null,      // 'friend' | 'random'
      room: null,      // 호스트가 받은 코드
      foe: null,       // 상대 닉네임
      role: null,      // 'host'(방을 만든 쪽) | 'guest'(코드로 들어간 쪽)
      phase: null,     // 'making' | 'hosting' | 'hunting'
      queue: null,     // 랜덤 매칭에서 줄 선 자리
      roomError: null, // 방 만들기·입장·매칭이 실패한 이유
      playing: false,  // 게임이 시작됐는지 (백엔드가 알려준 것)
      starting: false, // 시작을 요청해두고 대답을 기다리는 중
      startError: null,// 시작하지 못한 이유
      turn: null,      // 먼저 두는 사람의 닉네임 (백엔드가 정합니다)
      note: null       // 단계와 상관없이 맨 위에 알릴 말
    };

    function blank() {
      return { nick: null, playerId: null, mode: null, room: null, foe: null,
               role: null, phase: null, queue: null, roomError: null,
               playing: false, starting: false, startError: null, turn: null, note: null };
    }

    var timers = [];
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function clearAll() {
      // 기다리던 것과 1초마다 도는 시계를 함께 멈춥니다.
      timers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
      timers = [];
    }

    var $ = function (id) { return document.getElementById(id); };

    // ── 방 만들기 (웹소켓) ──────────────────────────────
    // HTTP 는 "물어보면 답한다"라서 한 번 주고받으면 끝입니다. 방을 만들고
    // 친구를 기다리는 일은 그걸로 안 됩니다 — 친구가 언제 올지 모르니까요.
    // 웹소켓은 선을 이어둔 채로 두는 방식이라, 백엔드가 먼저 말을 걸 수 있습니다.
    //
    // 이 통로의 규칙은 백엔드가 공개한 명세(/ws-docs)에 적혀 있습니다:
    //   · ws://…/ws/rooms?nickname=수진 로 접속하는 그 순간 방이 만들어집니다
    //   · 방 코드가 담긴 { type:"room_created", code, … } 가 바로 날아옵니다
    //   · 그 뒤로 연결을 끊지 않고 두는 것이 곧 "친구를 기다리는 상태"입니다
    //   · 끊으면 방도 같이 사라집니다
    var roomSock = null;

    // 우리 쪽에서 정리할 때 씁니다. onclose 를 먼저 떼는 이유는,
    // 우리가 일부러 끊는 것을 "사고로 끊겼다"고 알리지 않기 위해서입니다.
    function dropRoomSocket() {
      if (!roomSock) return;
      roomSock.onclose = null;
      roomSock.onerror = null;
      roomSock.onmessage = null;
      try { roomSock.close(); } catch (e) {}
      roomSock = null;
    }

    // 연결이 끊기면 게임도 함께 끝납니다. 게임 상태는 백엔드가 들고
    // 있고, 이 연결이 곧 그 게임이기 때문입니다. 다시 이어붙이는
    // 방법(재접속)은 아직 계약에 없습니다.
    function endGame(why) {
      // 게임 화면을 보고 있다가 갑자기 대기실로 돌아오면 무슨 일이
      // 벌어진 건지 알 수 없습니다. 그래서 맨 위에 이유를 남깁니다.
      if (s.playing) s.note = why || '연결이 끊겨 게임이 끝났습니다';
      s.playing = false; s.starting = false; s.startError = null; s.turn = null;
      // 게임판을 걷어냅니다. 다음 게임은 빈 판에서 새로 시작합니다.
      if (board) board = board.destroy();
      gameBuilt = false;
    }

    function failRoom(why) {
      dropRoomSocket();
      endGame();
      s.room = null;
      s.phase = null;
      s.roomError = why;
      render();
    }

    function makeRoom() {
      dropRoomSocket();
      s.phase = 'making';
      s.roomError = null;
      render();

      var sock;
      try {
        sock = new WebSocket(WS_BASE + '/ws/rooms?nickname=' + encodeURIComponent(s.nick));
      } catch (e) {
        failRoom('연결하지 못했어요 — ' + e.message);
        return;
      }
      roomSock = sock;

      sock.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }

        if (handleChat(msg)) return;
        if (handleGame(msg)) return;

        if (msg.type === 'room_created') {
          // 백엔드가 준 모양: { type, code, name, host_nickname, max_players }
          s.room = msg.code;
          s.role = 'host';
          s.phase = 'hosting';
          s.roomError = null;
          render();
          return;
        }

        // ★ 우리가 물어보지 않았는데 오는 메시지입니다.
        //   이 기능을 웹소켓으로 만든 이유가 바로 이것입니다. HTTP 였다면
        //   "혹시 친구 들어왔나요?"를 계속 되물어야 했습니다.
        if (msg.type === 'guest_joined') {
          s.foe = msg.nickname;
          render();
          return;
        }

        // 친구가 나가면 자리가 다시 빕니다. 방은 그대로 살아 있어서
        // 같은 코드로 다른 사람이 들어올 수 있습니다.
        if (msg.type === 'guest_left') {
          // 게임 중이었다면 게임도 여기서 끝납니다. 혼자서는 둘 수 없고,
          // 방은 그대로 살아 있어서 같은 코드로 다른 사람이 들어올 수 있습니다.
          // 닉네임은 renderNote 가 그릴 때 한 번 걸러줍니다. 여기서 또
          // 거르면 <나> 같은 이름이 &lt;나&gt; 로 두 번 바뀌어 보입니다.
          endGame((msg.nickname || '상대') + ' 님이 나가 게임이 끝났습니다');
          s.foe = null;
          s.phase = 'hosting';
          render();
          return;
        }

        if (msg.type === 'error') {
          // 기다리는 중이거나 이야기 중에 오는 안내는 방이 없어졌다는 뜻이
          // 아닙니다. (예: "아직 상대가 들어오지 않았습니다", 채팅 형식 위반)
          // 이때는 연결이 끊기지 않으므로 채팅 칸에 알리고 그대로 둡니다.
          if (s.phase === 'hosting' || s.foe) {
            if (chat) chat.system(msg.message);
            return;
          }
          failRoom(msg.message);
        }
      };

      sock.onclose = function () {
        // 우리가 끊은 것이면 위에서 onclose 를 떼놨으니 여기 안 옵니다.
        if (roomSock !== sock) return;
        roomSock = null;
        failRoom(s.phase === 'hosting' || s.foe
          ? '연결이 끊겨 방이 사라졌어요. 다시 만들어 주세요'
          : '방을 만들지 못했어요. 백엔드가 켜져 있는지 확인해 주세요');
      };
    }

    // ── 코드로 방에 들어가기 (웹소켓) ───────────────────
    // 방을 만드는 것과 같은 통로인데, 주소에 코드가 하나 더 붙습니다.
    //   ws://…/ws/rooms/K7Q2?nickname=엘리
    // 들어가지면 방장에게도 알림이 갑니다. 소문자로 쳐도 서버가 맞춰줍니다.
    function joinRoom(code, onFail) {
      dropRoomSocket();
      s.roomError = null;

      var sock;
      try {
        sock = new WebSocket(WS_BASE + '/ws/rooms/' + encodeURIComponent(code) +
                             '?nickname=' + encodeURIComponent(s.nick));
      } catch (e) {
        onFail('연결하지 못했어요 — ' + e.message);
        return;
      }
      roomSock = sock;

      // 'knocking' 두드리는 중 → 'in' 들어가 있음 → 'done' 이유를 이미 알림
      var stage = 'knocking';

      sock.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }

        if (handleChat(msg)) return;
        if (handleGame(msg)) return;

        if (msg.type === 'joined') {
          // 백엔드가 준 모양: { type, code, host_nickname, guest_nickname }
          stage = 'in';
          s.room = msg.code;
          s.foe = msg.host_nickname;
          s.role = 'guest';
          s.phase = null;
          s.roomError = null;
          render();
          return;
        }

        // 방장이 나가면 1:1 대화가 성립하지 않으므로 서버가 곧 연결도 닫습니다.
        // 그 코드는 죽었습니다 — 다시 들어가려면 새 코드를 받아야 합니다.
        if (msg.type === 'host_left') {
          stage = 'done';
          leaveRoom(msg.message || '방장이 나갔습니다');
          return;
        }

        if (msg.type === 'error') {
          // 이미 들어가 있다면 채팅 쪽 문제입니다(형식 위반 등).
          // 그럴 땐 연결이 끊기지 않으니 방에서 내보내면 안 됩니다.
          if (stage === 'in') {
            if (chat) chat.system(msg.message);
            return;
          }
          // 들어가지 못한 경우 — 명세상 서버가 곧 끊지만(1008), 기다리지 않고
          // 우리도 정리합니다. 저쪽이 끊어주겠거니 믿으면, 안 끊는 날 연결이 남습니다.
          stage = 'done';
          dropRoomSocket();
          if (onFail) onFail(msg.message);
        }
      };

      sock.onclose = function () {
        if (roomSock !== sock) return;
        roomSock = null;
        if (stage === 'knocking') {
          if (onFail) onFail('연결이 끊겼어요. 백엔드가 켜져 있는지 확인해 주세요');
        } else if (stage === 'in') {
          leaveRoom('연결이 끊겨 방에서 나왔어요');
        }
      };
    }

    // ── 랜덤 매칭 (웹소켓) ──────────────────────────────
    // 코드를 주고받지 않고 아무나 기다리는 사람과 짝지어 줍니다.
    //   ws://…/ws/match?nickname=수진
    //
    // 짝이 지어진 뒤는 코드로 만난 것과 완전히 같습니다. 그래서 채팅도
    // 이 통로를 그대로 씁니다 — roomSock 을 같이 쓰는 이유입니다.
    //
    // 눈여겨볼 점: 상대가 나가도 연결이 끊기지 않습니다. 서버가 알아서
    // 다시 줄을 세워주고, 마침 기다리는 사람이 있으면 바로 새 짝을 붙여
    // 줍니다. 우리가 다시 접속하면 기다린 시간이 없던 일이 되고 줄 맨
    // 뒤로 밀리므로, partner_left 를 받아도 연결을 건드리지 않습니다.
    function startMatch() {
      dropRoomSocket();
      s.phase = 'hunting';
      s.roomError = null;
      s.foe = null;
      render();

      var sock;
      try {
        sock = new WebSocket(WS_BASE + '/ws/match?nickname=' + encodeURIComponent(s.nick));
      } catch (e) {
        stopMatch('연결하지 못했어요 — ' + e.message);
        return;
      }
      roomSock = sock;

      sock.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }

        if (handleChat(msg)) return;
        if (handleGame(msg)) return;

        // 줄을 섰습니다. 기다리는 사람이 없다는 뜻입니다.
        if (msg.type === 'waiting') {
          s.foe = null;
          s.phase = 'hunting';
          s.queue = msg.position;
          render();
          return;
        }

        // ★ 기다리던 쪽에는 요청하지도 않았는데 오는 소식입니다.
        if (msg.type === 'matched') {
          s.room = msg.code;
          s.foe = msg.partner_nickname;
          // 먼저 기다린 쪽이 방장이 되지만, 채팅에서 하는 일은 같습니다.
          // 그래서 화면에서 굳이 구분하지 않습니다.
          s.role = 'guest';
          s.phase = null;
          render();
          return;
        }

        // 상대가 나갔습니다. 연결은 그대로 살아 있고, 바로 뒤에
        // waiting 이나 matched 가 이어서 옵니다.
        if (msg.type === 'partner_left') {
          var gone = msg.nickname;
          // 게임 중이었다면 여기서 끝납니다. 새 짝과는 새 게임입니다.
          endGame((gone || '상대') + ' 님이 나가 게임이 끝났습니다');
          s.foe = null;
          s.room = null;
          s.phase = 'hunting';
          render();
          // 새 짝과는 방이 새로 만들어지고 이전 대화는 이어지지 않습니다.
          // 화면에 남겨두면 새 상대가 한 말처럼 보이므로 비웁니다.
          if (chat) {
            chat.clear();
            chat.system(gone + ' 님이 나갔습니다. 새 상대를 찾는 중…');
          }
          return;
        }

        if (msg.type === 'error') {
          if (s.foe) { if (chat) chat.system(msg.message); return; }
          stopMatch(msg.message);
        }
      };

      sock.onclose = function () {
        if (roomSock !== sock) return;
        roomSock = null;
        stopMatch('연결이 끊겼어요. 백엔드가 켜져 있는지 확인해 주세요');
      };
    }

    // 매칭을 그만둡니다. 연결을 끊으면 줄에서도 빠집니다.
    function stopMatch(why) {
      dropRoomSocket();
      endGame();
      s.room = null; s.foe = null; s.phase = null; s.queue = null;
      s.roomError = why || null;
      render();
    }

    // 방에서 빠져나올 때 화면을 되돌립니다.
    function leaveRoom(why) {
      dropRoomSocket();
      endGame();
      s.room = null; s.foe = null; s.role = null; s.phase = null;
      s.roomError = why;
      render();
    }

    // ── 주소 (/ 와 /game) ───────────────────────────────
    // 페이지를 새로 불러오지 않고 주소만 바꿉니다. 새로 불러오면
    // 웹소켓이 끊기고, 끊기면 방도 같이 사라집니다(명세). 게임 중에
    // 연결이 끊기면 게임 자체가 없어지는 셈이라 그럴 수 없습니다.
    //
    // pushState = "주소창의 글자와 뒤로가기 기록만 바꾸기". 서버에는
    // 아무것도 물어보지 않습니다.
    function goTo(path) {
      if (location.pathname !== path) history.pushState({ at: path }, '', path);
      render();
    }

    // 뒤로가기·앞으로가기를 누르면 주소가 바뀌므로 다시 그립니다.
    // 연결은 건드리지 않습니다 — 화면만 오갈 뿐입니다.
    window.addEventListener('popstate', function () { render(); });

    function onGameScreen() { return s.playing && location.pathname === '/game'; }

    // ── 게임 시작 ───────────────────────────────────────
    // 방을 만들 때 쓰던 그 연결을 그대로 씁니다. 채팅과 같은 통로입니다.
    //
    // 명세(/asyncapi.json)에 적힌 형식입니다:
    //   보낼 때  { type: "start" }            ← 방장만 보낼 수 있습니다
    //   받을 때  { type: "game_started", code, host_nickname,
    //             guest_nickname, first_turn, at }
    //
    // 먼저 두는 사람(first_turn)은 백엔드가 무작위로 정합니다. 스크래블에서
    // 선공은 유리한 자리라, 방을 만들었다는 이유로 먼저 두면 불공평합니다.
    function startGame() {
      if (!roomSock || roomSock.readyState !== 1) {
        s.startError = '연결이 없어 시작하지 못했어요';
        render();
        return;
      }

      s.starting = true;
      s.startError = null;
      render();

      roomSock.send(JSON.stringify({ type: 'start' }));

      // 대답이 아예 안 올 수도 있습니다. 그대로 두면 화면이
      // "시작하는 중…"에서 영영 멈춥니다. 답이 없는 것도 하나의
      // 결과이므로 시간을 재두고, 지나면 다시 누를 수 있게 돌려놓습니다.
      later(function () {
        if (!s.starting) return;
        s.starting = false;
        s.startError = '백엔드가 대답하지 않았어요. 잠시 뒤 다시 눌러주세요';
        render();
      }, 5000);
    }

    // 방 통로로 들어온 메시지 중 게임 시작에 해당하는 것을 처리합니다.
    // 방 만들기·입장·랜덤 매칭 세 통로가 똑같이 씁니다.
    function handleGame(msg) {
      if (msg.type === 'game_started') {
        s.playing = true;
        s.starting = false;
        s.startError = null;
        s.turn = msg.first_turn || null;
        if (msg.code) s.room = msg.code;
        // 여기서 render() 를 부르지 않는 이유: 다시 그리면 뒤집히던
        // 타일이 통째로 새로 만들어져 연출이 사라집니다. 문이 다 열린
        // 다음에 goTo 가 화면을 바꾸면서 그때 한 번만 그립니다.
        openGate();
        later(function () { goTo('/game'); }, GATE_MS);
        return true;
      }

      // 시작을 요청해두고 기다리는 중에 오는 error 는 그 요청에 대한
      // 답입니다. 명세대로 연결은 끊기지 않으므로 방에서 내보내지 않고
      // 이유만 보여줍니다. 다시 누를 수 있습니다.
      if (msg.type === 'error' && s.starting) {
        s.starting = false;
        s.startError = msg.message;
        render();
        return true;
      }

      return false;
    }

    // 타일이 다 뒤집히고 대기실이 사라지기까지 걸리는 시간.
    // CSS 의 지연(0.4초) + 뒤집기(0.5초) + 대기실이 떠오르는 시간과 맞춥니다.
    var GATE_MS = 1150;

    function openGate() {
      var g = $('startGame');
      if (g) g.className = 'gate is-going';
      var lobby = $('lobbyView');
      // 타일이 다 뒤집힌 다음에 대기실을 걷어냅니다.
      later(function () { if (lobby) lobby.className = 'lobby is-opening'; }, 900);
    }

    // ── 그리기 ──────────────────────────────────────────
    function render() {
      // 게임이 끝났거나(연결이 끊겼거나) 시작된 적이 없는데 주소만
      // /game 이면 주소를 되돌립니다. 주소와 화면이 다른 말을 하면
      // 새로고침하거나 링크를 공유했을 때 없는 화면으로 들어가게 됩니다.
      // replaceState 는 뒤로가기 기록을 남기지 않습니다 — 없던 화면이라
      // 뒤로 갈 곳도 아니기 때문입니다.
      if (!s.playing && location.pathname === '/game') {
        history.replaceState({ at: '/' }, '', '/');
      }

      var playing = onGameScreen();

      // 대기실과 게임 화면은 둘 중 하나만 보입니다.
      // 지우지 않고 감추는 이유: 게임에서 대기실로 돌아왔을 때
      // 입력하던 것이 그대로 남아 있어야 하기 때문입니다.
      $('lobbyView').hidden = playing;
      $('gameView').hidden = !playing;
      if (!playing) $('lobbyView').className = 'lobby';

      renderNote();
      renderStepper();
      renderStep1();
      renderStep2();
      renderStep3();
      renderGame();
      syncChat();
    }

    function renderNote() {
      $('noteBox').innerHTML = s.note
        ? '<p class="note"><span class="note-icon">!</span>' + esc(s.note) + '</p>'
        : '';
    }

    // ── 채팅 ────────────────────────────────────────────
    // 채팅 자체는 chat/chat.js 가 다 합니다. 게임 화면도 같은 파일을
    // 쓰게 됩니다. 여기서 정하는 것은 "언제 붙이고 언제 떼는지"뿐입니다.
    var chat = null;
    var chatFoe = null;   // 채팅에 이미 알린 상대

    function syncChat() {
      // 닉네임이 정해지기 전에는 띄우지 않습니다.
      // 누가 한 말인지 가를 기준이 아직 없기 때문입니다.
      if (!s.nick) {
        if (chat) { chat = chat.destroy(); chatFoe = null; }
        return;
      }

      if (!chat) {
        chat = Chat.mount('#chatBox', {
          me: s.nick,
          title: '대기실 채팅',
          height: '300px',
          // 화면 오른쪽 아래 동그란 버튼으로 띄웁니다. 대기실에서 할 일은
          // 방을 잡는 것이라, 채팅이 자리를 크게 차지하면 안 됩니다.
          float: true,
          // 처음엔 닫아둡니다. 말이 오면 버튼에 숫자가 붙습니다.
          open: false,
          // 서버가 받아주는 한도와 맞춥니다. 화면에서만 더 짧게 막으면
          // 보낼 수 있는 말을 못 보내게 됩니다.
          maxLen: 500,
          // 혼자 있을 때는 잠가둡니다. 상대가 없으면 서버가 받아주지 않아서,
          // 열어두면 보내지지도 않을 글을 치게 됩니다.
          status: 'offline',
          // 내가 보낸 말은 서버가 되돌려 주지 않습니다(명세). 그래서 내 말은
          // 채팅 모듈이 바로 그립니다. 되돌려 받아 또 그리면 두 번 나옵니다.
          echo: true,
          onSend: sendChat
        });
        chat.system('방에 들어가면 이야기할 수 있어요');
      }

      // 채팅은 어느 화면에서도 저절로 펼치지 않습니다.
      //
      // 처음에는 상대가 오면 펼쳤습니다. 그때는 상대가 정해지면 할 일이
      // 이야기하는 것뿐이었으니 맞는 판단이었습니다. 그런데 대기실에는
      // 게임 시작 버튼이, 게임 화면에는 게임판이 생겼습니다. 펼친 채팅이
      // 그 둘을 다 덮습니다.
      //
      // 화면의 주인공은 지금 해야 할 일이고, 이야기는 곁들이는 것입니다.
      // 말이 오면 동그란 버튼에 숫자가 붙으니 놓치지도 않습니다.

      // 둘이 모였는지에 따라 채팅을 열고 닫습니다.
      if (s.foe && s.foe !== chatFoe) {
        chatFoe = s.foe;
        chat.setStatus('online');
        chat.system(s.role === 'guest'
          ? s.foe + ' 님의 방에 들어왔습니다'
          : s.foe + ' 님이 들어왔습니다');
        // 예전에는 여기서 바로 펼쳤습니다. 그때는 상대가 정해지면 할 일이
        // 이야기하는 것뿐이었기 때문입니다.
        //
        // 지금은 다릅니다 — 상대가 오면 방장은 게임 시작 버튼을 눌러야
        // 하는데, 좁은 화면(휴대폰)에서는 펼쳐진 채팅이 그 버튼을 통째로
        // 덮어 누를 수가 없습니다. 그래서 대기실에서는 접어두고, 말이 오면
        // 동그란 버튼에 숫자만 붙입니다.
      } else if (!s.foe && chatFoe) {
        chat.system(chatFoe + ' 님과의 연결이 끝났습니다');
        chat.setStatus('offline');
        chatFoe = null;
      }
    }

    // 채팅 보내기 — 방 통로를 그대로 씁니다.
    // 방장이든 들어간 쪽이든 보내는 형식은 똑같습니다.
    function sendChat(text) {
      if (!roomSock || roomSock.readyState !== 1) {
        if (chat) chat.system('연결이 없어 보내지 못했어요');
        return;
      }
      // 명세: 그냥 문자열이 아니라 JSON 으로 보냅니다.
      roomSock.send(JSON.stringify({ type: 'message', text: text }));
    }

    // 방 통로로 들어온 메시지 중 채팅에 해당하는 것을 처리합니다.
    // 방 만들기·입장 두 통로가 똑같이 씁니다.
    function handleChat(msg) {
      if (msg.type !== 'message') return false;
      // 여기 오는 건 전부 상대의 말입니다. 시각도 서버가 찍은 것을 씁니다
      // (각자 컴퓨터 시계를 쓰면 두 사람 화면에서 순서가 달라질 수 있습니다).
      if (chat) chat.receive({ from: msg.from, text: msg.text, at: msg.at });
      return true;
    }

    function renderStepper() {
      var pips = $('stepper').children;
      // 게임이 시작되면 세 칸이 모두 끝난 상태가 됩니다.
      var at = !s.nick ? 0 : !s.foe ? 1 : s.playing ? 3 : 2;
      for (var i = 0; i < 3; i++) {
        pips[i].className = 'pip' + (i < at ? ' is-done' : i === at ? ' is-now' : '');
      }
    }

    // ── ① 닉네임 — 이 단계만 진짜 백엔드를 부릅니다 ─────
    function renderStep1() {
      var body = $('step1Body');

      // 끝났으면 한 줄로 접습니다. 다 끝난 단계가 자리를 많이
      // 차지하고 있으면 지금 할 일이 어디인지 흐려집니다.
      if (s.nick) {
        body.innerHTML =
          '<p class="done-row"><i class="tick">✓</i><b>' + esc(s.nick) + '</b>' +
          '<span class="counter">id ' + esc(String(s.playerId)) + '</span>' +
          '<button class="btn-link" id="renick" type="button">바꾸기</button></p>';
        $('renick').addEventListener('click', function () {
          clearAll();
          dropRoomSocket();   // 다른 사람이 되는 것이므로 만들어 둔 방도 접습니다
          s = blank();
          render();
        });
        return;
      }

      // 들어오는 길이 둘입니다.
      //   로그인      — 전에 만들어 둔 닉네임으로 다시 들어오기
      //   새로 만들기 — 처음 온 사람이 닉네임을 등록하기
      body.innerHTML =
        '<div class="field-row">' +
          '<input class="field" id="nick" type="text" maxlength="' + NICK_MAX + '" ' +
                 'placeholder="닉네임을 입력하세요" autocomplete="off" />' +
          '<button class="btn-check" id="loginBtn" type="button">로그인</button>' +
          '<button class="btn-check is-plain" id="newBtn" type="button">새로 만들기</button>' +
        '</div>' +
        '<p class="hint" id="nickHint"><span class="counter">0 / ' + NICK_MAX + '</span></p>';

      var input = $('nick'), hint = $('nickHint');
      var loginBtn = $('loginBtn'), newBtn = $('newBtn');

      function valid(v) { return v.length > 0 && v.length <= NICK_MAX && !/\s/.test(v); }

      function paint(kind, text) {
        input.className = 'field' + (kind === 'ok' ? ' is-ok' : kind === 'bad' ? ' is-bad' : '');
        hint.className = 'hint' + (kind === 'ok' ? ' is-ok' : kind === 'bad' ? ' is-bad' : kind === 'wait' ? ' is-wait' : '');
        hint.innerHTML = '';
        if (kind === 'wait') hint.appendChild(el('span', 'waiting'));
        else if (kind === 'ok') hint.appendChild(el('span', 'hint-icon', '✓'));
        else if (kind === 'bad') hint.appendChild(el('span', 'hint-icon', '!'));
        if (text) hint.appendChild(document.createTextNode(' ' + text + ' '));
        hint.appendChild(el('span', 'counter', input.value.length + ' / ' + NICK_MAX));
      }

      // 요청을 보내는 동안은 두 버튼을 함께 잠급니다.
      // 로그인과 만들기가 동시에 날아가면 어느 쪽 결과가 남는지 알 수 없습니다.
      function lock(which, label) {
        input.disabled = true;
        loginBtn.disabled = true;
        newBtn.disabled = true;
        which.textContent = label;
      }

      // 확인이 끝나 입력칸을 다시 쓸 수 있게 되돌립니다.
      function unlock() {
        input.disabled = false;
        loginBtn.textContent = '로그인';
        newBtn.textContent = '새로 만들기';
        refresh();
      }

      // 쓸 만한 닉네임일 때만 두 버튼이 열립니다.
      function refresh() {
        var good = valid(input.value.trim());
        loginBtn.disabled = !good;
        newBtn.disabled = !good;
      }

      input.addEventListener('input', function () {
        var v = input.value;
        refresh();
        if (v.length && !valid(v)) paint('bad', '공백 없이 1~' + NICK_MAX + '자로 입력해 주세요');
        else paint('', '');
      });

      // ── 로그인 — 이미 있는 닉네임으로 다시 들어오기 ────
      function login() {
        var v = input.value.trim();
        if (!valid(v)) return;

        lock(loginBtn, '찾는 중…');
        paint('wait', '그 닉네임이 있는지 알아보는 중이에요');

        // 들어가려면 내 id 가 필요한데, 백엔드에 "닉네임으로 한 명 찾아주는"
        // API 가 아직 없습니다. 그래서 전체 목록을 받아 프론트가 찾습니다.
        // 사람이 많아지면 느려지므로, 나중에 그런 API 를 백엔드에 요청하는
        // 편이 좋습니다. (중복확인 API 는 있냐/없냐만 답하고 id 는 안 줍니다)
        fetch(API_BASE + '/api/players')
          .then(function (res) {
            if (!res.ok) throw new Error('서버 오류 (상태 코드 ' + res.status + ')');
            return res.json();
          })
          .then(function (players) {
            // find = 조건에 맞는 첫 번째 하나. 없으면 undefined.
            var me = players.find(function (p) { return p.nickname === v; });

            if (!me) {
              unlock();
              paint('bad', '그런 닉네임이 없어요. 처음이면 새로 만들기를 눌러주세요');
              input.focus(); input.select();
              return;
            }

            // 백엔드가 준 모양: { id, nickname, created_at }
            s.nick = me.nickname;
            s.playerId = me.id;
            render();
          })
          .catch(function (e) {
            unlock();
            paint('bad', '들어가지 못했어요 — ' + e.message);
          });
      }

      // ── 새로 만들기 — 중복 확인 후 등록 ────────────────
      function createNew() {
        var v = input.value.trim();
        if (!valid(v)) return;

        lock(newBtn, '확인 중…');
        paint('wait', '쓸 수 있는 닉네임인지 알아보는 중이에요');

        // 1단계 — 중복 확인 전용 API 에 물어봅니다. (GET)
        // 예전에는 전체 목록을 받아와 프론트가 직접 뒤졌지만, 이제 백엔드가
        // "쓸 수 있냐/없냐"만 딱 답해줍니다. 사람이 늘어도 오가는 데이터가
        // 그대로라 더 빠르고, 판단 기준도 백엔드 한 곳에만 있게 됩니다.
        // 없는 닉네임이어도 404 가 아니라 200 + exists:false 입니다.
        fetch(API_BASE + '/api/players/check-nickname?nickname=' + encodeURIComponent(v))
          .then(function (res) {
            // 422 = 보낸 값의 형식이 잘못됨
            if (res.status === 422) throw new Error('입력한 값의 형식이 올바르지 않습니다');
            if (!res.ok) throw new Error('서버 오류 (상태 코드 ' + res.status + ')');
            return res.json();
          })
          .then(function (check) {
            // 백엔드가 돌려준 모양: { nickname, exists }
            if (check.exists) {
              // 이미 있으면 저장(POST)을 아예 보내지 않고 여기서 멈춥니다.
              unlock();
              paint('bad', '이미 사용 중인 닉네임입니다');
              input.focus(); input.select();
              return null;
            }
            // 2단계 — 쓸 수 있으면 새 플레이어로 저장합니다. (POST)
            // 백엔드가 공백을 정리해 돌려준 닉네임을 그대로 씁니다.
            paint('wait', '닉네임을 저장하는 중이에요');
            return savePlayer(check.nickname);
          })
          .catch(function (e) {
            unlock();
            paint('bad', '확인하지 못했어요 — ' + e.message);
          });
      }

      function savePlayer(nickname) {
        return fetch(API_BASE + '/api/players', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // 백엔드와 약속한 모양: { "nickname": "수진" }
          body: JSON.stringify({ nickname: nickname })
        })
          .then(function (res) {
            // 201 = "성공 + 새 데이터가 만들어짐"
            if (res.status === 201) return res.json();
            // 422 = 보낸 값의 형식이 잘못됨
            if (res.status === 422) throw new Error('입력한 값의 형식이 올바르지 않습니다');
            throw new Error('서버 오류 (상태 코드 ' + res.status + ')');
          })
          .then(function (player) {
            // 백엔드가 돌려준 모양: { id, nickname, created_at }
            // 통과하면 이 단계는 접히고 다음 칸이 열립니다.
            s.nick = player.nickname;
            s.playerId = player.id;
            render();
          });
      }

      loginBtn.addEventListener('click', login);
      newBtn.addEventListener('click', createNew);

      // 엔터는 로그인으로 보냅니다. 새로 만드는 일은 한 번뿐이지만
      // 다시 들어오는 일은 올 때마다 있기 때문입니다.
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') login();
      });

      refresh();
      paint('', '');
    }

    // ── 모드 + 그에 따라 열리는 것 ──────────────────────
    function renderStep2() {
      var step = $('step2'), body = $('step2Body');
      step.className = 'step' + (s.nick ? '' : ' is-locked');

      if (!s.nick) {
        body.innerHTML =
          '<div class="modes">' + modeBox('l', null) + '</div>' +
          '<p class="hint">닉네임을 먼저 정해주세요</p>';
        return;
      }

      body.innerHTML = '<div class="modes" id="modes">' + modeBox('live', s.mode) + '</div>' +
                       '<div id="branch"></div>';

      [].slice.call(document.querySelectorAll('#modes .mode-input')).forEach(function (input) {
        input.addEventListener('change', function () {
          clearAll();
          // 모드를 바꾸면 그 아래에서 하던 건 지웁니다.
          // 안 그러면 랜덤 화면 밑에 아까 치던 방코드가 남습니다.
          // 만들어 둔 방이 있었다면 연결을 끊어 서버에서도 치웁니다.
          dropRoomSocket();
          s.mode = input.value; s.room = null; s.foe = null; s.role = null;
          s.phase = null; s.queue = null; s.roomError = null;
          s.playing = false; s.starting = false; s.startError = null; s.turn = null;
          s.note = null;   // 다른 것을 고르면 지난 알림은 지웁니다
          render();
        });
      });

      renderBranch();
    }

    function modeBox(name, picked) {
      function one(value, pics, label, desc) {
        return '<label class="mode">' +
          '<input class="mode-input" type="radio" name="' + name + '" value="' + value + '"' +
            (picked === value ? ' checked' : '') + (name === 'l' ? ' disabled' : '') + ' />' +
          '<div class="mode-pics">' + pics + '</div>' +
          '<div class="mode-name">' + label + '</div>' +
          '<div class="mode-desc">' + desc + '</div>' +
        '</label>';
      }
      var meTile = '<i class="mode-pic">' + (s.nick ? esc(s.nick.charAt(0)) : '나') + '</i>';
      return one('friend', meTile + '<i class="mode-pic">친</i>', '친구', '코드로 만나기') +
             one('random', meTile + '<i class="mode-pic is-any">?</i>', '랜덤', '아무나 만나기');
    }

    // ── 모드에 따라 갈리는 부분 ────────────────────────
    function renderBranch() {
      var box = $('branch');
      if (!box) return;

      if (!s.mode) { box.innerHTML = ''; return; }
      if (s.mode === 'friend') return renderFriend(box);
      return renderRandom(box);
    }

    // ③ 방 만들기 + ② 코드 입력 — 친구 모드는 두 갈래입니다.
    // 아래 '방 만드는 중'·'기다리는 중' 화면은 그려는 두었지만 지금은 닿지
    // 않습니다. 거기까지 데려다 줄 방 API 가 아직 없기 때문입니다.
    function renderFriend(box) {

      // 둘이 다 모였습니다. 방장이든 들어간 쪽이든 같은 모습입니다.
      if (s.foe) {
        box.innerHTML =
          '<div class="split">' +
            versus(s.foe, 'found') +
            '<p class="hint is-mid">방 코드 ' + esc(s.room || '') + '</p>' +
          '</div>';
        return;
      }

      // 방을 만들고 기다리는 중
      if (s.phase === 'hosting') {
        box.innerHTML =
          '<div class="split">' +
            '<p class="split-label">친구에게 알려줄 코드</p>' +
            '<div class="code-show">' + s.room.split('').map(function (c) {
              return '<div class="show-cell">' + c + '</div>';
            }).join('') + '</div>' +
            '<div class="share-row">' +
              '<button class="btn-copy" id="copy" type="button">코드 복사</button>' +
              '<button class="btn-cancel" id="dropRoom" type="button">방 없애기</button>' +
            '</div>' +
            versus(null, 'empty') +
            '<p class="hint is-wait is-mid"><span class="waiting"></span>친구가 들어오길 기다리는 중…</p>' +
          '</div>';

        $('copy').addEventListener('click', function () {
          try { navigator.clipboard.writeText(s.room); } catch (e) {}
          var b = $('copy');
          b.className = 'btn-copy is-done'; b.textContent = '복사했어요';
          later(function () {
            if ($('copy')) { $('copy').className = 'btn-copy'; $('copy').textContent = '코드 복사'; }
          }, 2000);
        });

        $('dropRoom').addEventListener('click', function () {
          clearAll();
          // 연결을 끊으면 서버에서도 그 방이 없어집니다. 따로 알릴 것이 없습니다.
          dropRoomSocket();
          s.room = null; s.phase = null; s.roomError = null;
          render();
        });
        return;
      }

      // 방을 만드는 중
      if (s.phase === 'making') {
        box.innerHTML =
          '<div class="split">' +
            '<button class="btn-wide" type="button" disabled>만드는 중…</button>' +
            '<p class="hint is-wait is-mid"><span class="waiting"></span>방을 만들고 있어요</p>' +
          '</div>';
        return;
      }

      // 아직 아무것도 안 함 — 두 갈래를 나란히 보여줍니다.
      box.innerHTML =
        '<div class="split">' +
          '<p class="split-label">친구가 준 코드가 있다면</p>' +
          '<div class="entry-row">' +
            '<div class="code-row" id="codeRow">' +
              cells() +
            '</div>' +
            '<button class="btn-enter" id="enter" type="button" disabled>입장</button>' +
          '</div>' +
          '<p class="hint" id="codeHint"></p>' +
          '<p class="or">또는</p>' +
          '<button class="btn-wide" id="make" type="button">방 만들기</button>' +
          (s.roomError
            ? '<p class="hint is-bad"><span class="hint-icon">!</span>' + esc(s.roomError) + '</p>'
            : '<p class="hint is-mid">방을 만들면 네 글자 코드가 나와요</p>') +
        '</div>';

      wireCode();
      $('make').addEventListener('click', makeRoom);
    }

    function cells() {
      var out = '';
      for (var i = 0; i < CODE_LEN; i++) {
        out += '<input class="code-cell" type="text" maxlength="1" autocomplete="off" ' +
               'aria-label="방코드 ' + (i + 1) + '번째 글자" />';
      }
      return out;
    }

    function wireCode() {
      var row   = $('codeRow');
      var cs    = [].slice.call(row.querySelectorAll('.code-cell'));
      var enter = $('enter');
      var hint  = $('codeHint');
      // 코드에 안 나오는 글자(O·I·L·0·1)는 아예 못 치게 막습니다.
      var OK    = /[A-HJKMNP-Z2-9]/;

      function code() { return cs.map(function (c) { return c.value; }).join(''); }

      function refresh() {
        enter.disabled = code().length < CODE_LEN;
        row.className = 'code-row';
        hint.className = 'hint'; hint.textContent = '';
      }

      cs.forEach(function (cell, i) {
        cell.addEventListener('input', function () {
          var ch = cell.value.toUpperCase().slice(-1);
          cell.value = OK.test(ch) ? ch : '';
          if (cell.value && i < CODE_LEN - 1) cs[i + 1].focus();
          refresh();
        });
        cell.addEventListener('keydown', function (e) {
          if (e.key === 'Backspace' && !cell.value && i > 0) cs[i - 1].focus();
          if (e.key === 'Enter' && !enter.disabled) enter.click();
        });
        cell.addEventListener('paste', function (e) {
          e.preventDefault();
          var t = (e.clipboardData || window.clipboardData).getData('text').toUpperCase()
                    .split('').filter(function (c) { return OK.test(c); }).join('').slice(0, CODE_LEN);
          cs.forEach(function (c, k) { c.value = t[k] || ''; });
          cs[Math.min(t.length, CODE_LEN - 1)].focus();
          refresh();
        });
      });

      enter.addEventListener('click', function () {
        var typed = code();

        enter.disabled = true; enter.textContent = '확인 중…';
        cs.forEach(function (c) { c.disabled = true; });
        hint.className = 'hint is-wait';
        hint.innerHTML = '';
        hint.appendChild(el('span', 'waiting'));
        hint.appendChild(document.createTextNode(' 그런 방이 있는지 알아보는 중이에요'));

        joinRoom(typed, function (why) {
          // 들어가지 못했습니다 — 흔들고, 비우고, 첫 칸으로 돌려보냅니다.
          // 서버는 "없는 코드"와 "방장이 이미 나간 코드"를 구분해 주지
          // 않습니다. 어느 쪽이든 할 일은 같고(코드를 다시 받기),
          // 구분해 주면 아무 코드나 넣어보며 알아내는 데 쓰일 수 있어서입니다.
          cs.forEach(function (c) { c.disabled = false; });
          enter.textContent = '입장';
          row.className = 'code-row is-bad is-shake';
          hint.className = 'hint is-bad';
          hint.innerHTML = '';
          hint.appendChild(el('span', 'hint-icon', '!'));
          hint.appendChild(document.createTextNode(' ' + why));

          later(function () {
            cs.forEach(function (c) { c.value = ''; });
            row.className = 'code-row';
            enter.disabled = true;
            cs[0].focus();
          }, 900);
        });
      });

      refresh();
    }

    // ④ 랜덤 매칭
    function renderRandom(box) {
      // 짝이 지어졌습니다. 코드로 만난 것과 같은 모습입니다.
      if (s.foe) {
        box.innerHTML = '<div class="split">' + versus(s.foe, 'found') + '</div>';
        return;
      }

      if (s.phase === 'hunting') {
        box.innerHTML =
          '<div class="split">' +
            versus(null, 'hunting') +
            '<p class="elapsed" id="clock">00:00</p>' +
            '<button class="btn-wide is-quiet" id="stopMatch" type="button">취소</button>' +
            (s.queue
              ? '<p class="queue"><i class="queue-dot"></i>줄 <b>' + s.queue + '</b>번째로 기다리는 중</p>'
              : '') +
          '</div>';

        // 얼마나 기다렸는지 보여줍니다. 아무 변화가 없으면 멈춘 것처럼
        // 보이기 때문입니다. 이건 화면 안에서만 도는 시계입니다.
        var n = 0, clockEl = $('clock');
        var tileEl = document.querySelector('.player.is-hunting .player-tile');
        var tick = setInterval(function () {
          n++;
          if (clockEl) clockEl.textContent = mmss(n);
          if (tileEl) tileEl.textContent = LETTERS[Math.floor(Math.random() * LETTERS.length)];
        }, 1000);
        timers.push(tick);   // 상태가 바뀌면 같이 멈춥니다.

        $('stopMatch').addEventListener('click', function () {
          clearAll(); clearInterval(tick);
          // 연결을 끊으면 줄에서도 빠집니다.
          stopMatch('매칭을 멈췄어요');
        });
        return;
      }

      box.innerHTML =
        '<div class="split">' +
          versus(null, 'empty') +
          '<button class="btn-wide" id="startMatch" type="button">매칭 시작</button>' +
          (s.roomError
            ? '<p class="hint is-bad"><span class="hint-icon">!</span>' + esc(s.roomError) + '</p>'
            : '<p class="hint is-mid">기다리는 사람과 바로 짝지어 드려요</p>') +
        '</div>';

      $('startMatch').addEventListener('click', startMatch);
    }

    // 두 사람 자리 — 친구·랜덤이 같은 모양을 씁니다.
    function versus(foe, kind) {
      var right = foe
        ? '<div class="player is-found"><div class="player-tile">' + esc(foe.charAt(0)) + '</div>' +
          '<div class="player-name">' + esc(foe) + '</div><div class="player-role">상대</div></div>'
        : '<div class="player is-empty' + (kind === 'hunting' ? ' is-hunting' : '') + '">' +
          '<div class="player-tile">' + (kind === 'hunting' ? 'K' : '?') + '</div>' +
          '<div class="player-name">' + (kind === 'hunting' ? '찾는 중…' : '비어 있음') + '</div>' +
          '<div class="player-role">상대</div></div>';

      return '<div class="versus">' +
        '<div class="player"><div class="player-tile">' + esc(s.nick.charAt(0)) + '</div>' +
        '<div class="player-name">' + esc(s.nick) + '</div><div class="player-role">나</div></div>' +
        '<div class="vs">VS</div>' + right + '</div>';
    }

    // ── ③ 시작 ─────────────────────────────────────────
    function renderStep3() {
      var step = $('step3'), body = $('step3Body');
      var ready = !!s.foe;
      step.className = 'step' + (ready ? '' : ' is-locked');

      if (!ready) {
        body.innerHTML =
          '<div class="leaving is-idle">' +
            '<p class="hint is-mid">상대가 정해지면 여기가 열립니다</p>' +
          '</div>';
        return;
      }

      // 이미 시작해 놓고 뒤로가기로 대기실에 와 있는 경우.
      // 게임은 그대로 돌아가고 있으므로 돌아갈 길만 열어둡니다.
      if (s.playing) {
        body.innerHTML =
          '<div class="leaving">' +
            '<p class="hint is-ok is-mid"><span class="hint-icon">✓</span> 게임이 진행 중입니다</p>' +
            '<button class="btn-wide" id="backToGame" type="button" style="margin-top:12px">게임 화면으로</button>' +
          '</div>';
        $('backToGame').addEventListener('click', function () { goTo('/game'); });
        return;
      }

      // 시작할 수 있는 사람인가.
      //   친구 모드 — 방을 만든 쪽(host)만 시작합니다.
      //   랜덤 매칭 — 누가 방장인지 프론트가 알 수 없습니다. matched 메시지에
      //               그 정보가 없기 때문입니다. 그래서 둘 다에게 보여주고,
      //               방장이 아니면 백엔드가 거절하기를 기대합니다.
      //               (docs/backend-requests.md 에 개선 요청을 적어뒀습니다)
      var canStart = s.mode === 'random' || s.role === 'host';

      if (!canStart) {
        // 눌리지 않는 버튼을 보여주는 대신 아예 다른 것을 보여줍니다.
        // 잠긴 버튼은 고장 난 것처럼 보이고, 왜 안 되는지도 안 알려줍니다.
        body.innerHTML =
          '<div class="await">' +
            '<div class="await-tiles" aria-hidden="true">' +
              '<div class="await-tile">대</div><div class="await-tile">기</div>' +
              '<div class="await-tile">중</div><div class="await-tile">…</div>' +
            '</div>' +
            '<p class="hint is-mid">' + esc(s.foe) + ' 님이 시작하기를 기다리는 중이에요</p>' +
          '</div>';
        return;
      }

      // 방장 — 문을 엽니다.
      var word = ['게', '임', '시', '작', '!'];
      var pips = [2, 3, 1, 4, 5];   // 타일 구석의 점수. 장식입니다.

      body.innerHTML =
        '<button class="gate' + (s.starting ? ' is-waiting' : '') + '" id="startGame" ' +
                'type="button"' + (s.starting ? ' disabled' : '') + '>' +
          '<p class="gate-label">' + (s.starting ? '시작하는 중…' : '눌러서 시작') + '</p>' +
          '<span class="gate-tiles">' +
            word.map(function (ch, i) {
              return '<span class="gate-tile">' +
                       '<span class="gate-face gate-front">' + ch +
                         '<i class="gate-pip">' + pips[i] + '</i></span>' +
                       '<span class="gate-face gate-back">' + ch +
                         '<i class="gate-pip">' + pips[i] + '</i></span>' +
                     '</span>';
            }).join('') +
          '</span>' +
        '</button>' +
        // 실패했을 때는 백엔드가 한 말을 그대로 보여줍니다. 우리가 고쳐
        // 쓰면 진짜 이유가 가려집니다. ("방장만 게임을 시작할 수 있습니다"
        // 처럼 백엔드가 이미 사람이 읽을 수 있게 써 줍니다)
        (s.startError
          ? '<p class="hint is-bad"><span class="hint-icon">!</span>' + esc(s.startError) + '</p>'
          : '<p class="hint is-mid">' + esc(s.foe) + ' 님과 함께 들어갑니다</p>');

      if (!s.starting) $('startGame').addEventListener('click', startGame);
    }

    // ── 게임 화면 (/game) ──────────────────────────────
    // 게임판은 아직 없습니다. 지금 이 화면이 하는 일은 "정말 시작됐다"와
    // "누구 차례다"를 보여주는 것뿐입니다. 없는 것을 미리 그려두면 되는
    // 것처럼 보이다가, 진짜 게임이 붙는 순간 조용히 어긋납니다.
    var gameBuilt = false;   // 게임 화면의 뼈대를 이미 만들었는지
    var board = null;        // 게임판 모듈

    function renderGame() {
      if (!onGameScreen()) return;

      // 뼈대는 한 번만 만듭니다. 매번 innerHTML 로 다시 쓰면 그때마다
      // 225칸짜리 게임판이 통째로 새로 그려집니다 — 느리기도 하고,
      // 나중에 판에 놓아둔 글자도 같이 지워집니다.
      if (!gameBuilt) {
        $('gameView').innerHTML =
          '<div id="nameBar"></div>' +
          '<div class="stage-body">' +
            '<div id="boardBox"></div>' +
            '<p class="hint is-mid">아직 글자를 놓을 수 없습니다 — ' +
              '놓는 규칙이 백엔드와 정해지면 열립니다</p>' +
            '<div class="stage-foot">' +
              '<button class="btn-cancel" id="toLobby" type="button">대기실 보기</button>' +
            '</div>' +
          '</div>';

        // 화면만 대기실로 돌아갑니다. 백엔드에는 아무것도 알리지 않습니다 —
        // "게임에서 나간다"는 계약이 아직 없기 때문입니다. 연결은 그대로라
        // 게임도 그대로 살아 있고, 언제든 다시 들어올 수 있습니다.
        $('toLobby').addEventListener('click', function () { goTo('/'); });

        board = Board.mount('#boardBox');
        gameBuilt = true;
      }

      // 매번 바뀌는 것만 다시 씁니다.
      renderNameBar();
    }

    // ── 상단 이름 바 ───────────────────────────────────
    // 두 사람의 이름을 양끝에 두고 가운데를 비워둡니다.
    //
    // 이름은 둘 다 각자 정한 닉네임입니다. 내 것은 로그인할 때 백엔드가
    // 돌려준 값(s.nick), 상대 것은 웹소켓이 알려준 값(s.foe)이라
    // 프론트가 지어낸 글자가 하나도 없습니다.
    //
    // 누구 차례인지도 여기서 함께 보여줍니다. 이름과 차례를 따로 두면
    // 같은 이야기를 두 군데서 하게 되고, 눈이 두 곳을 오갑니다.
    function renderNameBar() {
      var box = $('nameBar');
      if (!box) return;

      // 백엔드가 first_turn 을 알려주기 전에는 아무 쪽도 표시하지
      // 않습니다. 둘 중 하나를 골라 두면 그건 지어낸 값입니다.
      function side(name, role, cls) {
        var turn = s.turn && s.turn === name;
        return '<div class="nb-side ' + cls + (turn ? ' is-turn' : '') + '">' +
                 '<span class="nb-tile">' + esc(name.charAt(0)) + '</span>' +
                 '<span class="nb-who">' +
                   '<b class="nb-name">' + esc(name) + '</b>' +
                   '<i class="nb-role">' + role + (turn ? ' · 차례' : '') + '</i>' +
                 '</span>' +
               '</div>';
      }

      box.className = 'namebar';
      box.innerHTML =
        side(s.nick, '나', 'is-me') +
        // 가운데 — 나중에 스코어와 남은 시간이 들어올 자리입니다.
        // 둘 다 백엔드가 정해서 알려줘야 하는 값이라 지금은 비워두고,
        // 방 코드만 놓습니다. 0 점이라고 적어두면 진짜 0 점인지
        // 아직 모르는 것인지 구분이 안 됩니다.
        '<div class="nb-mid">' +
          '<span class="nb-vs">VS</span>' +
          '<span class="nb-room">' + esc(s.room || '') + '</span>' +
        '</div>' +
        (s.foe ? side(s.foe, '상대', 'is-foe') : '');
    }

    // ── 잡일 ───────────────────────────────────────────
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      e.className = cls;
      if (text) e.textContent = text;
      return e;
    }

    // 닉네임에 <, > 같은 글자가 들어 있어도 화면이 깨지지 않게 바꿔줍니다.
    function esc(v) {
      var d = document.createElement('div');
      d.textContent = v;
      return d.innerHTML;
    }

    function mmss(t) {
      var m = Math.floor(t / 60), x = t % 60;
      return (m < 10 ? '0' + m : m) + ':' + (x < 10 ? '0' + x : x);
    }

    // ── 첫 화면 ────────────────────────────────────────
    // 주소창에 /game 을 직접 치거나, 게임 중에 새로고침한 경우입니다.
    // 웹소켓은 페이지가 살아 있는 동안만 유지되므로 새로 불러온 순간
    // 이미 연결이 없습니다. 다시 이어붙이는 방법은 계약에 없으니
    // 대기실로 되돌리고 왜 그런지 알립니다. (되돌리는 일은 render 가 합니다)
    if (location.pathname === '/game') {
      s.note = '게임 화면은 대기실에서 시작해야 열립니다 — 새로고침하면 연결이 끊겨 게임이 사라집니다';
    }

    render();
  })();
</script>
</body>
</html>
